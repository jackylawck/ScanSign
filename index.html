<!DOCTYPE html>
<html lang="zh-HK" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  
  <!-- 🔍 Google 站長驗證 -->
  <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY">

  <!-- 🔍 基礎 SEO 核心標籤 -->
  <title>⚡ 一掃簽 ScanSign | 零伺服器離線加密簽到系統</title>
  <meta name="description" content="一掃簽 (ScanSign) 是一款純前端、零伺服器架構的企業級活動簽到系統。採用 ECDSA P-256 離線驗簽與 AES-256-GCM 名冊加密，支援飛航模式單機作業、去重稽核與極速入場。">
  <meta name="keywords" content="一掃簽, ScanSign, 離線簽到, 零伺服器, PWA, ECDSA P-256, WebCrypto, QR Code 驗票, 活動報到, 隱私安全, ISO27001">
  <meta name="author" content="ScanSign Systems">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://jackylawck.github.io/ScanSign/">

  <!-- 🌐 Open Graph / Facebook / LinkedIn 社交卡片 -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jackylawck.github.io/ScanSign/">
  <meta property="og:title" content="⚡ 一掃簽 ScanSign | 企業級離線加密簽到系統">
  <meta property="og:description" content="一掃即簽，離線入場。純瀏覽器端運算、數學級防偽、嚴格杜絕個資外洩，保障 300 人年會現場秒級流暢核驗。">
  <meta property="og:image" content="https://jackylawck.github.io/ScanSign/icons/ScanSign512icon.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="一掃簽 ScanSign 官方標誌">
  <meta property="og:locale" content="zh_HK">
  <meta property="og:site_name" content="一掃簽 ScanSign">

  <!-- 🐦 Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="⚡ 一掃簽 ScanSign | Offline Check-in PWA">
  <meta name="twitter:description" content="Zero-server, mathematically unforgeable event check-in powered by ECDSA P-256 & WebCrypto.">
  <meta name="twitter:image" content="https://jackylawck.github.io/ScanSign/icons/ScanSign512icon.png">

  <!-- 📱 PWA 與行動裝置桌面安裝設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="一掃簽">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <meta name="application-name" content="一掃簽 ScanSign">
  
  <!-- 📱 桌面圖示連結 (iOS 與各平台快捷圖標) -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/ScanSign192icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/ScanSign192icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/ScanSign512icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- 🛡️ 企業級安全策略：嚴格 CSP、相機限縮授權與防點擊劫持 -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    worker-src 'self';
    style-src 'self';
    img-src 'self' data: blob: https://jackylawck.github.io;
    connect-src 'self';
    manifest-src 'self';
    base-uri 'none';
    form-action 'none';
  ">
  <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=()">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="stylesheet" href="css/style.css">

  <!-- 1. 外部防點擊劫持守衛 -->
  <script src="js/frame-guard.js"></script>

  <!-- 2. 本地 Vendor 函式庫 -->
  <script src="vendor/html5-qrcode.min.js" 
          integrity="sha384-n0uCuolixUn4zIi7DF6kW0CL6WdTRFl/7xbx48UR+N8MWvQnbpG9tZN/me4I9S9m" 
          crossorigin="anonymous"></script>
</head>
<body>

  <!-- 語言切換浮動按鈕 -->
  <button id="langToggleBtn" class="lang-toggle-btn" type="button">English</button>

  <!-- 獨立提示條 -->
  <div id="ramModeNotice" class="banner-notice hidden" data-i18n="ramModeNotice">⚠️ 目前處於純記憶體模式，請勿重新整理頁面</div>
  <div id="swUpdateNotice" class="banner-notice banner-info hidden" data-i18n="swUpdateNotice">📢 系統有新版本，請於活動結束後再行重新整理。</div>
  <div id="cameraFallbackNotice" class="banner-notice hidden" data-i18n="cameraFallbackNotice">相機啟動受限，請使用下方手動補登</div>

  <!-- PIN 碼解鎖遮罩 -->
  <div id="pinLockScreen" class="overlay">
    <div class="pin-card">
      <h2 data-i18n="pinTitle">請輸入工作 PIN 碼</h2>
      <p data-i18n="pinDesc">解密當日名冊並啟用驗票工作台</p>
      
      <!-- 方案 B：自帶名冊選取區 -->
      <div class="form-group">
        <label for="manifestSourceSelect" data-i18n="selectManifestSource">活動名冊來源：</label>
        <select id="manifestSourceSelect">
          <option value="default" data-i18n="manifestDefault">示範名冊 (內建 Demo)</option>
          <option value="custom" data-i18n="manifestCustom">📁 自行載入名冊 (.enc.json)</option>
        </select>
      </div>

      <!-- 自訂名冊檔案上傳區 (預設隱藏) -->
      <div id="customManifestContainer" class="form-group hidden">
        <label for="manifestFileInput" data-i18n="uploadManifestLabel">選擇加密名冊檔案：</label>
        <input type="file" id="manifestFileInput" accept=".json,.enc.json" class="file-input-control">
        <div id="manifestFileInfo" class="file-status-tag">尚未選擇檔案</div>
      </div>

      <div class="form-group">
        <label for="initialDeviceSelect" data-i18n="selectStation">指定工位：</label>
        <select id="initialDeviceSelect">
          <option value="" disabled selected data-i18n="selectStationPrompt">-- 請選擇工位 / Select Station --</option>
          <option value="C1">C1 (掃碼 1 / Scanner 1)</option>
          <option value="C2">C2 (掃碼 2 / Scanner 2)</option>
          <option value="C3">C3 (引導台 / Greeter)</option>
          <option value="C4">C4 (異常台 / Help Desk)</option>
        </select>
      </div>

      <input type="password" id="pinInput" maxlength="8" placeholder="PIN" autocomplete="off" inputmode="numeric">
      <button id="unlockBtn" class="btn-primary" data-i18n="unlockBtn">解鎖系統</button>
      <div id="pinError" class="error-msg"></div>

      <!-- 📱 PWA 安裝按鈕與 iOS 提示 -->
      <button id="installPwaBtn" class="btn-tool pwa-install-btn hidden" type="button" data-i18n="installPwaBtn">
        📲 加入手機主畫面 (安裝 App)
      </button>
      <div id="iosInstallGuide" class="banner-notice ios-guide-box hidden" data-i18n="iosInstallGuide">
        💡 iOS 用戶：請點擊 Safari 底部的「分享」圖示 ⎋，然後選擇「加入主畫面」以獲得全螢幕流暢體驗。
      </div>
    </div>
  </div>

  <!-- 主工作台 (解鎖後顯示) -->
  <main id="mainApp" class="hidden">
    <header class="status-bar">
      <div class="counter-tag" id="currentStationTag">C1</div>
      <div class="live-tally"><span data-i18n="checkedInCount">已簽到：</span><span id="scanCountDisplay">0</span></div>
    </header>

    <!-- 相機掃描視窗 -->
    <section id="reader-container">
      <div id="reader"></div>
    </section>

    <!-- 核心結果卡片 (雙視角 DOM) -->
    <section id="resultCard" class="result-card idle">
      <!-- 工作人員視角 -->
      <div class="view-panel view-staff">
        <div class="card-guest-name" id="staffGuestName" data-i18n="idlePrompt">請出示入場 QR Code</div>
        <div class="table-number-row">
          <span class="table-digit" id="staffTableDigit">--</span>
          <span class="table-unit" id="staffTableUnit" data-i18n="tableUnit">圍</span>
        </div>
        <div class="card-location-hint" id="staffLocationHint" data-i18n="idleSub">對準上方鏡頭</div>
      </div>

      <!-- 賓客視角 (180 度大字) -->
      <div class="view-panel view-guest">
        <div class="table-number-row">
          <span class="table-digit" id="guestTableDigit">--</span>
          <span class="table-unit" id="guestTableUnit" data-i18n="guestTableUnit">號桌</span>
        </div>
        <div class="guest-welcome" id="guestWelcomeText" data-i18n="welcome">歡迎蒞臨</div>
        <div class="card-location-hint" id="guestLocationHint" data-i18n="pleaseProceed">請入座</div>
      </div>
    </section>

    <!-- 手動搜尋補登區 -->
    <section class="manual-box">
      <div class="input-wrapper">
        <input type="text" id="manualInput" class="manual-input" 
               placeholder="輸入姓名或電話後 4 碼補登..." 
               data-i18n-placeholder="searchPlaceholder" 
               autocomplete="off">
        <button type="button" class="clear-btn" id="clearSearchBtn">✕</button>
      </div>
      <div id="searchResults" class="search-results"></div>
    </section>

    <!-- 底部安全控制列 -->
    <footer class="footer-tools">
      <button class="btn-tool" id="flipViewBtn" data-i18n="btnFlipGuest">🔄 翻轉卡片(給賓客看)</button>
      <button class="btn-tool" id="exportSafeBtn" data-i18n="btnExport">📥 匯出資料</button>
    </footer>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
