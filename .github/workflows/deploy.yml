name: Deploy ScanSign PWA

on:
  push:
    branches: [ main ]

# 顯式宣告 permissions，確保 GITHUB_TOKEN 有權限推送到 gh-pages 分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inject Cache Version, SRI and Integrity Map
        run: |
          # 1. 注入唯一版本號至 sw.js
          CACHE_VER="v$(date +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          sed -i "s|__CACHE_VERSION__|$CACHE_VER|g" sw.js

          # 2. 自動計算 Vendor SRI 雜湊並注入 index.html
          if [ -f vendor/html5-qrcode.min.js ]; then
            VENDOR_HASH="sha384-$(openssl dgst -sha384 -binary vendor/html5-qrcode.min.js | openssl base64 -A)"
            sed -i "s|__VENDOR_SRI_HASH__|$VENDOR_HASH|g" index.html
          fi

          # 3. 固化所有核心與新模組 (包含 admin.js) 的 SHA-256 指紋
          python3 scripts/inject_sw_integrity.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          # 避免將 GitHub Actions 設定檔重複發佈至 gh-pages 分支
          exclude_assets: '.github,scripts'
